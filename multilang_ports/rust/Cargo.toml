[package]
name = "procesador_metadatos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "procesador"
path = "metadata/main.rs"

[[bin]]
name = "datalake"
path = "datalake/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
regex = "1.10"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
bson = "2.0"