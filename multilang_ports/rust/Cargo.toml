[package]
name = "procesador_metadatos"
version = "0.1.0"
edition = "2021"

[lib]
name = "search_engine_bench"
path = "lib.rs"

[[bin]]
name = "datalake"
path = "datalake/main.rs"

[[bin]]
name = "index"
path = "inverted_index/main.rs"

[[bin]]
name = "bench"
path = "benchmark/main.rs"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
chrono = "0.4"
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
